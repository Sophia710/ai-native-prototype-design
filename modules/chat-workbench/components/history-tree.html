/*
 * AI 原生原型设计 — 设计令牌（CSS 变量）
 * 由 tokens/tokens.json 生成，请勿手工维护本文件；修改令牌请改 tokens.json。

 */

:root {
  color-scheme: light;

  /* 文字 */
  --ds-text-primary: #1F1F1F;
  --ds-text-secondary: #595959;
  --ds-text-tertiary: #787878;
  --ds-text-quaternary: #B3B3B3;

  /* 表面 */

  --ds-surface-muted: #F7F7F7;
  --ds-surface-raised: #FFFFFF;
  --ds-surface-strong: #F0F0F0;

  /* 结构 */
  --ds-border: #E5E5E5;
  --ds-border-strong: #D4D4D4;
  --ds-divider: #EBEBEB;

  /* 交互中性态（灰阶，不是蓝） */
  --ds-hover-fill: rgba(0, 0, 0, 0.04);
  --ds-active-fill: rgba(0, 0, 0, 0.08);
  --ds-scrim: rgba(0, 0, 0, 0.45);

  /* 语义色 */
  --ds-color-danger: #DC2626;
  --ds-on-danger: #FFFFFF;
  --ds-color-positive: #16A34A;
  --ds-color-warning: #B45309;

  /* 强调蓝：仅数据可视化与真实语义 */
  --ds-color-accent: #2563EB;
  --ds-on-accent: #FFFFFF;

  /* 图表系列 */
  --ds-chart-1: #2563EB;
  --ds-chart-2: #DC2626;
  --ds-chart-3: #16A34A;
  --ds-chart-4: #7C3AED;
  --ds-chart-5: #8C8C8C;

  /* 间距阶 4/8/12/16/20/24/32 */
  --ds-space-1: 4px;
  --ds-space-2: 8px;
  --ds-space-3: 12px;
  --ds-space-4: 16px;
  --ds-space-5: 20px;
  --ds-space-6: 24px;
  --ds-space-7: 32px;

  /* 圆角阶 */
  --ds-radius-small: 4px;
  --ds-radius-chip: 6px;
  --ds-radius-button: 8px;
  --ds-radius-input: 10px;
  --ds-radius-panel: 12px;
  --ds-radius-large: 16px;
  --ds-radius-full: 9999px;

  /* 动效 */
  --ds-t-micro: 80ms;
  --ds-t-fast: 120ms;
  --ds-t-normal: 200ms;
  --ds-t-slow: 300ms;
  --ds-t-spin: 1s;
  --ds-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ds-ease-in: cubic-bezier(0.7, 0, 0.84, 0);
  --ds-ease-standard: cubic-bezier(0.4, 0, 0.2, 1);

  /* 字体 */
  --ds-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --ds-font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --ds-font-serif: Georgia, "Songti SC", "SimSun", serif;

  /* 排版 */
  --ds-fs-caption: 12px;
  --ds-lh-caption: 18px;
  --ds-fs-compact: 14px;
  --ds-lh-compact: 22px;
  --ds-fs-body: 16px;
  --ds-lh-body: 24px;
  --ds-fs-title: 17px;
  --ds-lh-title: 26px;
  --ds-fs-page: 20px;
  --ds-lh-page: 28px;
  --ds-fs-display: 32px;
  --ds-lh-display: 1.2;
  --ds-weight-regular: 400;
  --ds-weight-medium: 500;

  /* 阴影与焦点环 */
  --ds-shadow-raised: 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 16px rgba(0, 0, 0, 0.06);
  --ds-focus-ring: 0 0 0 2px rgba(31, 31, 31, 0.35);

  /* 壳层几何 */
  --ds-left-width: 260px;
  --ds-left-min: 240px;
  --ds-left-max: 320px;
  --ds-right-width: 480px;
  --ds-right-min: 320px;
  --ds-right-max: 720px;
  --ds-center-min: 360px;
  --ds-touch-target: 44px;
}

/* 盒模型统一 border-box：几何 token 表达含边框的完整盒 */
*,
*::before,
*::after {
  box-sizing: border-box;
}

/* 页面基色单点定义：只有 body 可以设置页面背景；组件内部不再设置基色 */
body {
  margin: 0;
  padding: 0;
  background: var(--ds-surface);
  color: var(--ds-text-primary);
  font-family: var(--ds-font-sans);
  font-size: var(--ds-fs-body);
  line-height: var(--ds-lh-body);
  font-weight: var(--ds-weight-regular);
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* 本地字体重置：控件继承 sans，数字使用 tabular-nums */
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

svg text {
  font-family: var(--ds-font-sans);
}

.ds-number,
[class*="number"] {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* 图标统一渲染：1.8px 线性、currentColor、round；外层 svg 必须带 viewBox="0 0 24 24"，
   尺寸由其 width/height 属性控制（16/18/20/24），否则 <use> 内 symbol 会按 24px 原尺寸溢出被裁 */
.ds-icon {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}

/* 原生控件保持中性，不用浏览器默认蓝 */
input[type="range"],
input[type="checkbox"],
input[type="radio"],
progress {
  accent-color: var(--ds-text-primary);
}

/* 统一焦点环：深色，不用蓝；box-shadow 自动跟随元素自身圆角，不在此覆盖圆角 */
:focus-visible {
  outline: none;
  box-shadow: var(--ds-focus-ring);
}

/* 尊重减弱动效偏好 */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ===== [复制区] 依赖组件 CSS：button（随本组件一并复制） ===== */
/* button —— 基础按钮：颜色强调只用深色，灰阶承担交互态 */
[data-component="button"] {
  /* 组件自身无包裹样式；.ds-btn 为复制后使用的根类 */
}

.ds-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--ds-space-2);
  box-sizing: border-box;
  height: 32px;
  padding: 0 var(--ds-space-4);
  margin: 0;
  border: 1px solid var(--ds-border);
  border-radius: var(--ds-radius-button);
  background-color: var(--ds-surface-raised);
  color: var(--ds-text-primary);
  font-family: inherit;
  font-size: var(--ds-fs-compact);
  font-weight: var(--ds-weight-medium);
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  transition:
    background-color var(--ds-t-fast) var(--ds-ease-standard),
    border-color var(--ds-t-fast) var(--ds-ease-standard);
}

.ds-btn:hover {
  background-color: var(--ds-surface-strong);
  border-color: var(--ds-border-strong);
}

.ds-btn:active {
  background-color: var(--ds-surface-strong);
}

.ds-btn .ds-icon {
  flex: none;
}

/* primary：深色实底；hover/active 用主题感知的中性叠加层（浅=压黑，深=提白） */
.ds-btn--primary {
  background-color: var(--ds-text-primary);
  border-color: var(--ds-text-primary);
  color: var(--ds-on-primary);
}

.ds-btn--primary:hover {
  background-color: var(--ds-text-primary);
  border-color: var(--ds-text-primary);
  background-image: linear-gradient(var(--ds-hover-fill), var(--ds-hover-fill));
}

.ds-btn--primary:active {
  background-image: linear-gradient(var(--ds-active-fill), var(--ds-active-fill));
}

/* ghost：无底无框，仅 hover 显露灰底 */
.ds-btn--ghost {
  background-color: transparent;
  border-color: transparent;
}

.ds-btn--ghost:hover {
  background-color: var(--ds-hover-fill);
  border-color: transparent;
}

.ds-btn--ghost:active {
  background-color: var(--ds-active-fill);
}

/* danger：危险实底，仅用于删除等破坏性主动作 */
.ds-btn--danger {
  background-color: var(--ds-color-danger);
  border-color: var(--ds-color-danger);
  color: var(--ds-on-danger);
}

.ds-btn--danger:hover {
  background-color: var(--ds-color-danger);
  border-color: var(--ds-color-danger);
  background-image: linear-gradient(var(--ds-hover-fill), var(--ds-hover-fill));
}

.ds-btn--danger:active {
  background-image: linear-gradient(var(--ds-active-fill), var(--ds-active-fill));
}

/* 尺寸 */
.ds-btn--sm {
  height: 28px;
  padding: 0 var(--ds-space-3);
  font-size: var(--ds-fs-caption);
  border-radius: var(--ds-radius-chip);
}

/* 禁用：disabled 属性驱动，键盘不可达、不派发 click */
.ds-btn:disabled,
.ds-btn[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.5;
  background-image: none;
}

.ds-btn--primary:disabled,
.ds-btn--danger:disabled {
  background-color: var(--ds-text-quaternary);
  border-color: var(--ds-text-quaternary);
  color: var(--ds-on-primary);
}

.ds-btn--ghost:disabled {
  background-color: transparent;
}

.ds-btn--block {
  display: flex;
  width: 100%;
}

/* ===== [复制区] 依赖组件 CSS：icon-button（随本组件一并复制） ===== */
/* icon-button —— 视觉盒 24/32，命中区恒 44px（::before 向四周外扩，不占布局） */
.ds-icon-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  width: 32px;
  height: 32px;
  padding: 0;
  margin: 0;
  border: none;
  border-radius: var(--ds-radius-button);
  background-color: transparent;
  color: var(--ds-text-secondary);
  cursor: pointer;
  flex: none;
  transition:
    background-color var(--ds-t-fast) var(--ds-ease-standard),
    color var(--ds-t-fast) var(--ds-ease-standard);
}

/* hidden 属性必须生效：本基元 display:inline-flex（作者样式）会压过 UA 的 [hidden]{display:none}，
   不显式补回会导致"隐藏"按钮仍渲染（如壳层右栏互斥展收钮） */
.ds-icon-btn[hidden] {
  display: none;
}

/* 命中区外扩到触控下限：absolute 居中、不改变布局与视觉盒 */
.ds-icon-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  min-width: var(--ds-touch-target);
  min-height: var(--ds-touch-target);
  margin: auto;
}

.ds-icon-btn:hover {
  background-color: var(--ds-hover-fill);
  color: var(--ds-text-primary);
}

.ds-icon-btn:active {
  background-color: var(--ds-active-fill);
}

/* 选中/开关态：灰阶，不用彩色 */
.ds-icon-btn.is-active,
.ds-icon-btn[aria-pressed="true"] {
  background-color: var(--ds-active-fill);
  color: var(--ds-text-primary);
}

/* 置于填充区域内时的描边浅底变体 */
.ds-icon-btn--subtle {
  background-color: var(--ds-surface-muted);
}

.ds-icon-btn--subtle:hover {
  background-color: var(--ds-surface-strong);
}

/* 小尺寸视觉盒（命中区仍 44）；圆角与 md 同档：规则映射 icon buttons 统一 8px */
.ds-icon-btn--sm {
  width: 24px;
  height: 24px;
  border-radius: var(--ds-radius-button);
}

.ds-icon-btn:disabled,
.ds-icon-btn[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.4;
  background-color: transparent;
  color: var(--ds-text-quaternary);
}

.ds-icon-btn .ds-icon {
  flex: none;
}

/* ===== [复制区] 依赖组件 CSS：popover-menu（随本组件一并复制） ===== */
/* popover-menu —— position:fixed 由 JS 定位；不写在组件内的流中 */
.ds-popover {
  position: fixed;
  z-index: 1000;
  box-sizing: border-box;
  min-width: 176px;
  max-width: 320px;
  padding: var(--ds-space-1);
  border: 1px solid var(--ds-border);
  border-radius: var(--ds-radius-panel);
  background-color: var(--ds-surface-raised);
  box-shadow: var(--ds-shadow-raised);
}

.ds-popover[hidden] {
  display: none;
}

.ds-popover__item {
  display: flex;
  align-items: center;
  gap: var(--ds-space-2);
  box-sizing: border-box;
  width: 100%;
  height: 32px;
  padding: 0 var(--ds-space-2);
  margin: 0;
  border: none;
  border-radius: var(--ds-radius-chip);
  background-color: transparent;
  color: var(--ds-text-primary);
  font-family: inherit;
  font-size: var(--ds-fs-compact);
  font-weight: var(--ds-weight-regular);
  line-height: 1;
  text-align: left;
  white-space: nowrap;
  cursor: pointer;
}

.ds-popover__item:hover,
.ds-popover__item.is-focused {
  background-color: var(--ds-active-fill);
}

.ds-popover__item[aria-disabled="true"] {
  color: var(--ds-text-quaternary);
  cursor: not-allowed;
  background-color: transparent;
}

/* 左图标列固定 18，无图标也对齐；右 check 同列宽 */
.ds-popover__icon {
  flex: none;
  width: 18px;
  height: 18px;
  color: var(--ds-text-secondary);
}

.ds-popover__label {
  flex: 1 1 auto;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ds-popover__shortcut {
  flex: none;
  margin-left: var(--ds-space-4);
  color: var(--ds-text-quaternary);
  font-size: var(--ds-fs-caption);
}

.ds-popover__check {
  flex: none;
  width: 16px;
  height: 16px;
  margin-left: var(--ds-space-2);
  color: var(--ds-text-primary);
}

.ds-popover__item:not(.is-checked) .ds-popover__check {
  visibility: hidden;
}

/* 危险项：图标与文字同为 danger，hover 用 danger 的浅色混合底 */
.ds-popover__item--danger,
.ds-popover__item--danger .ds-popover__icon {
  color: var(--ds-color-danger);
}

.ds-popover__item--danger:hover,
.ds-popover__item--danger.is-focused {
  background-color: color-mix(in srgb, var(--ds-color-danger) 10%, transparent);
}

.ds-popover__separator {
  height: 1px;
  margin: var(--ds-space-1) calc(var(--ds-space-1) + var(--ds-space-1));
  background-color: var(--ds-divider);
}

/* 单选项的描述行（model-switcher 复用）：双行结构 */
.ds-popover__item--two-line {
  height: auto;
  min-height: 40px;
  padding-top: var(--ds-space-2);
  padding-bottom: var(--ds-space-2);
  white-space: normal;
  line-height: 1.3;
}

.ds-popover__item--two-line .ds-popover__texts {
  display: flex;
  flex-direction: column;
  gap: var(--ds-space-1);
}

.ds-popover__desc {
  color: var(--ds-text-tertiary);
  font-size: var(--ds-fs-caption);
  font-weight: var(--ds-weight-regular);
}

.ds-popover__item--danger .ds-popover__desc {
  color: inherit;
  opacity: 0.75;
}

/* ===== [复制区] 依赖组件 CSS：dialog-confirm（随本组件一并复制） ===== */
/* dialog-confirm —— 模态强确认；scrim 与面板同层于 fixed 容器 */
.ds-dialog {
  position: fixed;
  inset: 0;
  z-index: 1100;
  display: none;
}

.ds-dialog[hidden] {
  display: none;
}

.ds-dialog.is-open {
  display: block;
}

.ds-dialog__scrim {
  position: absolute;
  inset: 0;
  background: var(--ds-scrim);
  animation: ds-dialog-fade var(--ds-t-normal) var(--ds-ease-out);
}

.ds-dialog__panel {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 400px;
  max-width: calc(100vw - var(--ds-space-7));
  box-sizing: border-box;
  padding: var(--ds-space-6);
  border-radius: var(--ds-radius-panel);
  background: var(--ds-surface-raised);
  box-shadow: var(--ds-shadow-raised);
  transform: translate(-50%, -50%);
  animation: ds-dialog-pop var(--ds-t-normal) var(--ds-ease-out);
}

@keyframes ds-dialog-fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes ds-dialog-pop {
  from { opacity: 0; transform: translate(-50%, calc(-50% + 8px)); }
  to { opacity: 1; transform: translate(-50%, -50%); }
}

.ds-dialog__head {
  display: flex;
  align-items: flex-start;
  gap: var(--ds-space-3);
}

.ds-dialog__icon {
  flex: none;
  margin-top: var(--ds-space-1);
  color: var(--ds-color-danger);
}

.ds-dialog__title {
  margin: 0;
  font-size: var(--ds-fs-title);
  font-weight: var(--ds-weight-medium);
  line-height: var(--ds-lh-title);
  color: var(--ds-text-primary);
}

.ds-dialog__body {
  margin: var(--ds-space-3) 0 0;
  font-size: var(--ds-fs-compact);
  line-height: var(--ds-lh-compact);
  color: var(--ds-text-secondary);
}

.ds-dialog__actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--ds-space-2);
  margin-top: var(--ds-space-6);
}

/* ===== [复制区] 依赖组件 CSS：inline-rename（随本组件一并复制） ===== */
/* inline-rename —— 行名原地替换为单行 input；宽度不超过行可用宽（PH-14/15） */
.ds-rename__input {
  flex: 1 1 auto;
  min-width: 0;
  height: 24px;
  box-sizing: border-box;
  padding: 0 var(--ds-space-2);
  border: 1px solid var(--ds-border-strong);
  border-radius: var(--ds-radius-input);
  background: var(--ds-surface);
  color: var(--ds-text-primary);
  font-family: inherit;
  font-size: var(--ds-fs-compact);
  line-height: 1;
}

/* 名称节点在重命名期间隐藏（由 JS 加 hidden 属性；[hidden] 兜底） */
.ds-rename__anchor[hidden] {
  display: none;
}

/* ===== [复制区] 组件 CSS 开始：history-tree ===== */
/* history-tree —— 左栏项目/会话两级树；栏内独立滚动（WS-1） */
.ds-history {
  height: 100%;
  min-height: 0;
  box-sizing: border-box;
  overflow-y: auto;
  padding: var(--ds-space-1) var(--ds-space-3) var(--ds-space-2);
}

.ds-history__group + .ds-history__group {
  margin-top: var(--ds-space-4);
}

/* 分组标题行：chevron + 静态标题 + hover/focus-within 显露的 ＋ */
.ds-history__group-head {
  display: flex;
  align-items: center;
  gap: var(--ds-space-1);
  height: 32px;
  padding: 0 var(--ds-space-2);
}

.ds-history__chev {
  color: var(--ds-text-tertiary);
}

.ds-history__chev .ds-icon {
  transition: transform var(--ds-t-fast) var(--ds-ease-standard);
}

.ds-history__group[data-expanded="false"] > .ds-history__group-head .ds-history__chev .ds-icon {
  transform: rotate(-90deg);
}

.ds-history__group-label {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--ds-fs-caption);
  line-height: var(--ds-lh-caption);
  color: var(--ds-text-tertiary);
}

/* 行操作显露区：opacity/visibility 保留布局占位（PH-9/PH-X2） */
.ds-history__group-actions,
.ds-history__row-actions {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: var(--ds-space-1);
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--ds-t-fast) var(--ds-ease-out), visibility 0s linear var(--ds-t-fast);
}

.ds-history__group-head:hover .ds-history__group-actions,
.ds-history__group-head:focus-within .ds-history__group-actions,
.ds-history__row:hover .ds-history__row-actions,
.ds-history__row:focus-within .ds-history__row-actions,
.ds-history__group-actions:focus-within,
.ds-history__row-actions:focus-within,
.ds-history__row.is-renaming .ds-history__row-actions {
  opacity: 1;
  visibility: visible;
  transition: opacity var(--ds-t-fast) var(--ds-ease-out);
}

.ds-history__group-body {
  display: flex;
  flex-direction: column;
  gap: var(--ds-space-1);
}

.ds-history__group[data-expanded="false"] > .ds-history__group-body {
  display: none;
}

/* 项目两级：项目行 + 可整体展收的会话子区 */
.ds-history__project {
  display: flex;
  flex-direction: column;
  gap: var(--ds-space-1);
}

.ds-history__project-body {
  display: flex;
  flex-direction: column;
  gap: var(--ds-space-1);
}

.ds-history__project[data-expanded="false"] .ds-history__project-body {
  display: none;
}

.ds-history__project[data-expanded="false"] > .ds-history__row--project .ds-history__chev .ds-icon {
  transform: rotate(-90deg);
}

/* 通用行 */
.ds-history__row {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--ds-space-2);
  box-sizing: border-box;
  height: 32px;
  padding: 0 var(--ds-space-2);
  border-radius: var(--ds-radius-button);
}

.ds-history__row:hover {
  background: var(--ds-hover-fill);
}

.ds-history__folder {
  flex: none;
  color: var(--ds-text-secondary);
}

.ds-history__label {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: var(--ds-fs-compact);
  color: var(--ds-text-primary);
}

/* 项目行：父级选中态只加粗、不灰底（PH-7） */
.ds-history__row--project.is-parent .ds-history__label {
  font-weight: var(--ds-weight-medium);
}

/* 会话行：名称即按钮（整块可点、键盘可达），缩进对齐项目名 */
.ds-history__main {
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  display: flex;
  align-items: center;
  padding: 0;
  border: none;
  background: transparent;
  color: var(--ds-text-primary);
  font-family: inherit;
  font-size: var(--ds-fs-compact);
  text-align: left;
  cursor: pointer;
  border-radius: var(--ds-radius-chip);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ds-history__row--conversation {
  padding-left: calc(var(--ds-space-2) + 24px + var(--ds-space-2));
}

/* 「最近」平铺会话不缩进 */
.ds-history__row--conversation.ds-history__row--recent {
  padding-left: var(--ds-space-2);
}

.ds-history__row--conversation.is-current {
  background: var(--ds-active-fill);
}

.ds-history__row--conversation.is-current:hover {
  background: var(--ds-active-fill);
}

.ds-history__row--conversation.is-current .ds-history__label {
  color: var(--ds-text-primary);
}

/* 重命名中行内控件禁用由组件加 disabled；行本身保持 hover 底但不再触发切换 */
.ds-history__row.is-renaming {
  background: var(--ds-hover-fill);
}
/* ===== [复制区] 组件 CSS 结束：history-tree ===== */

/* —— 演示外壳（仅供组件实物页，禁止复制进交付物）—— */
.demo-topbar { position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:12px;
  height:48px; padding:0 16px; background:var(--ds-surface); border-bottom:1px solid var(--ds-divider); }
.demo-topbar__title { font-size:var(--ds-fs-compact); font-weight:var(--ds-weight-medium); }
.demo-topbar__tag { font-size:var(--ds-fs-caption); color:var(--ds-text-tertiary); }
.demo-topbar__spacer { flex:1; }
.demo-main { padding:24px; }
.demo-section { margin-bottom:24px; }
.demo-section > h3 { font-size:var(--ds-fs-caption); font-weight:var(--ds-weight-medium);
  color:var(--ds-text-tertiary); margin:0 0 8px; text-transform:uppercase; letter-spacing:.04em; }
.demo-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.demo-row + .demo-row { margin-top:12px; }
.demo-canvas { border:1px dashed var(--ds-border-strong); border-radius:var(--ds-radius-panel); padding:16px; }

/* —— history-tree 演示外壳样式（仅供本页目检，禁止复制进交付物）—— */
.ht-event-log {
  margin: var(--ds-space-3) 0 0;
  padding: var(--ds-space-2);
  max-height: 120px;
  overflow: auto;
  border: 1px solid var(--ds-border);
  border-radius: var(--ds-radius-input);
  background: var(--ds-surface-muted);
  font-size: var(--ds-fs-caption);
  line-height: var(--ds-lh-caption);
  color: var(--ds-text-secondary);
  white-space: pre-wrap;
}

<script>
/* ===== [复制区] 依赖组件 JS：popover-menu（随本组件一并复制） ===== */
/* popover-menu
 * 用法：
 *   DSPopoverMenu.open({
 *     anchor: triggerEl,
 *     align: 'start' | 'end',
 *     items: [
 *       { icon: 'pencil', label: '重命名', action: 'rename', shortcut: 'F2' },
 *       { icon: 'check-only?' },
 *       { divider: true },
 *       { icon: 'trash', label: '删除', action: 'delete', danger: true, disabled: false },
 *       { label: '两行项', desc: '能力描述', checked: true, twoLine: true }
 *     ],
 *     onSelect(action, item, index) {}
 *   }) -> close()
 * 行为：焦点进首项 / ↑↓ Home End / Enter / Esc 回焦 / 外部点击、祖先滚动、resize 关闭。
 */
(function (global) {
  'use strict';

  var current = null;

  function iconSvg(name, size) {
    if (!name) {
      return '<span class="ds-popover__icon" aria-hidden="true"></span>';
    }
    return (
      '<svg class="ds-popover__icon ds-icon" viewBox="0 0 24 24" width="' + size + '" height="' + size + '" aria-hidden="true">' +
      '<use href="#i-' + name + '"></use></svg>'
    );
  }

  function buildItem(item, index) {
    if (item.divider) {
      return '<div class="ds-popover__separator" role="separator"></div>';
    }
    var cls = ['ds-popover__item'];
    if (item.danger) cls.push('ds-popover__item--danger');
    if (item.checked) cls.push('is-checked');
    if (item.twoLine || item.desc) cls.push('ds-popover__item--two-line');

    var labelInner = item.desc
      ? '<span class="ds-popover__texts"><span class="ds-popover__label">' + item.label +
        '</span><span class="ds-popover__desc">' + item.desc + '</span></span>'
      : '<span class="ds-popover__label">' + item.label + '</span>';

    var check =
      '<svg class="ds-popover__check ds-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">' +
      '<use href="#i-check"></use></svg>';

    return (
      '<button type="button" role="menuitem" class="' + cls.join(' ') + '" data-index="' + index + '"' +
      (item.disabled ? ' aria-disabled="true"' : '') + ' tabindex="-1">' +
      iconSvg(item.icon || '', 18) +
      labelInner +
      (item.shortcut ? '<span class="ds-popover__shortcut">' + item.shortcut + '</span>' : '') +
      check +
      '</button>'
    );
  }

  function open(opts) {
    if (current) current.close();

    var anchor = opts.anchor;
    var items = opts.items || [];
    var align = opts.align === 'end' ? 'end' : 'start';

    var root = document.createElement('div');
    root.setAttribute('data-component', 'popover-menu');
    root.className = 'ds-popover';
    root.setAttribute('role', 'menu');
    root.innerHTML = items.map(buildItem).join('');
    document.body.appendChild(root);

    var enabledItems = Array.prototype.slice
      .call(root.querySelectorAll('.ds-popover__item'))
      .filter(function (el) { return !el.getAttribute('aria-disabled'); });

    var focusIndex = -1;

    function focusAt(i) {
      if (!enabledItems.length) return;
      focusIndex = (i + enabledItems.length) % enabledItems.length;
      enabledItems[focusIndex].focus();
      enabledItems.forEach(function (el, idx) { el.classList.toggle('is-focused', idx === focusIndex); });
    }

    function position() {
      var rect = anchor.getBoundingClientRect();
      var margin = 8;
      var w = root.offsetWidth;
      var h = root.offsetHeight;
      var left = align === 'end' ? rect.right - w : rect.left;
      var top = rect.bottom + 4;
      if (left + w > window.innerWidth - margin) left = window.innerWidth - w - margin;
      if (left < margin) left = margin;
      if (top + h > window.innerHeight - margin) {
        var above = rect.top - h - 4;
        if (above >= margin) top = above;
        else top = Math.max(margin, window.innerHeight - h - margin);
      }
      root.style.left = left + 'px';
      root.style.top = top + 'px';
    }

    function close(restoreFocus) {
      if (current !== state) return;
      current = null;
      anchor.setAttribute('aria-expanded', 'false');
      document.removeEventListener('pointerdown', onPointerDown, true);
      document.removeEventListener('keydown', onKeydown, true);
      window.removeEventListener('resize', close0, true);
      window.removeEventListener('scroll', close0, true);
      if (root.parentNode) root.parentNode.removeChild(root);
      if (restoreFocus !== false) anchor.focus();
    }
    var close0 = function () { close(); };
    var state = { anchor: anchor, close: close };
    current = state;

    function onPointerDown(e) {
      if (root.contains(e.target) || anchor.contains(e.target) || e.target === anchor) return;
      close();
    }

    function onKeydown(e) {
      switch (e.key) {
        case 'ArrowDown': e.preventDefault(); focusAt(focusIndex < 0 ? 0 : focusIndex + 1); break;
        case 'ArrowUp': e.preventDefault(); focusAt(focusIndex < 0 ? enabledItems.length - 1 : focusIndex - 1); break;
        case 'Home': e.preventDefault(); focusAt(0); break;
        case 'End': e.preventDefault(); focusAt(enabledItems.length - 1); break;
        case 'Enter':
        case ' ':
          e.preventDefault();
          if (focusIndex >= 0) activate(enabledItems[focusIndex]);
          break;
        case 'Escape':
          e.preventDefault();
          e.stopPropagation();
          close();
          break;
        case 'Tab':
          close();
          break;
      }
    }

    function activate(btn) {
      if (!btn || btn.getAttribute('aria-disabled')) return;
      var index = Number(btn.getAttribute('data-index'));
      var item = items[index];
      close();
      if (typeof opts.onSelect === 'function') opts.onSelect(item.action || item.label, item, index);
    }

    root.addEventListener('click', function (e) {
      var btn = e.target.closest('.ds-popover__item');
      if (btn) activate(btn);
    });
    root.addEventListener('mouseover', function (e) {
      var btn = e.target.closest('.ds-popover__item');
      if (btn && !btn.getAttribute('aria-disabled')) {
        enabledItems.forEach(function (el) { el.classList.remove('is-focused'); });
        focusIndex = enabledItems.indexOf(btn);
        btn.classList.add('is-focused');
      }
    });

    document.addEventListener('pointerdown', onPointerDown, true);
    document.addEventListener('keydown', onKeydown, true);
    window.addEventListener('resize', close0, true);
    window.addEventListener('scroll', close0, true);
    anchor.setAttribute('aria-expanded', 'true');
    position();
    focusAt(0);

    return close;
  }

  function isOpen(anchor) {
    return !!(current && (anchor ? current.anchor === anchor : true));
  }

  function closeCurrent() {
    if (current) current.close();
  }

  global.DSPopoverMenu = { open: open, isOpen: isOpen, closeCurrent: closeCurrent };
})(window);

/* ===== [复制区] 依赖组件 JS：dialog-confirm（随本组件一并复制） ===== */
/* dialog-confirm
 * DSDialog.confirm({
 *   title: string, body: string（可含由调用方构造好的安全文本/片段）,
 *   confirmText='确认', cancelText='取消', danger=true,
 *   returnFocus?: HTMLElement
 * }) -> Promise<true|false>
 * 克隆 #ds-dialog-reference；默认焦点在取消；Tab 面板内循环；Esc/scrim=取消；关后回焦。
 */
(function (global) {
  'use strict';

  var seq = 0;
  var active = null;

  function confirm(opts) {
    var tpl = document.getElementById('ds-dialog-reference');
    if (!tpl) return Promise.reject(new Error('missing #ds-dialog-reference'));

    var node = tpl.cloneNode(true);
    node.removeAttribute('id');
    node.removeAttribute('hidden');
    node.classList.add('is-open');

    var danger = opts.danger !== false;
    var titleEl = node.querySelector('[data-role="title"]');
    var bodyEl = node.querySelector('[data-role="body"]');
    var cancelBtn = node.querySelector('[data-role="cancel"]');
    var confirmBtn = node.querySelector('[data-role="confirm"]');
    var iconEl = node.querySelector('.ds-dialog__icon');
    var panel = node.querySelector('.ds-dialog__panel');

    var uid = 'ds-dialog-' + ++seq;
    titleEl.id = uid + '-title';
    bodyEl.id = uid + '-body';
    panel.setAttribute('aria-labelledby', titleEl.id);
    panel.setAttribute('aria-describedby', bodyEl.id);

    titleEl.textContent = opts.title || '';
    bodyEl.textContent = opts.body || '';
    cancelBtn.textContent = opts.cancelText || '取消';
    confirmBtn.textContent = opts.confirmText || '确认';
    confirmBtn.classList.add(danger ? 'ds-btn--danger' : 'ds-btn--primary');
    if (!danger) iconEl.style.display = 'none';

    document.body.appendChild(node);

    var previouslyFocused = opts.returnFocus || document.activeElement;

    return new Promise(function (resolve) {
      function done(result) {
        if (active !== state) return;
        active = null;
        document.removeEventListener('keydown', onKeydown, true);
        if (node.parentNode) node.parentNode.removeChild(node);
        if (previouslyFocused && typeof previouslyFocused.focus === 'function') {
          previouslyFocused.focus();
        }
        resolve(result);
      }

      function onKeydown(e) {
        if (e.key === 'Escape') {
          e.preventDefault();
          e.stopPropagation();
          done(false);
          return;
        }
        if (e.key === 'Tab') {
          // 全手动焦点循环：不依赖浏览器原生 Tab 顺序，焦点永不离开面板
          e.preventDefault();
          var f = [cancelBtn, confirmBtn];
          var idx = f.indexOf(document.activeElement);
          var next = (idx + (e.shiftKey ? -1 : 1) + f.length) % f.length;
          f[next].focus();
        }
      }

      var state = {};
      active = state;

      cancelBtn.addEventListener('click', function () { done(false); });
      confirmBtn.addEventListener('click', function () { done(true); });
      node.querySelector('.ds-dialog__scrim').addEventListener('click', function () { done(false); });
      document.addEventListener('keydown', onKeydown, true);

      // 入场后聚焦取消（PH-18：默认焦点永远不是危险项）
      cancelBtn.focus();
    });
  }

  global.DSDialog = { confirm: confirm };
})(window);

/* ===== [复制区] 依赖组件 JS：inline-rename（随本组件一并复制） ===== */
/* inline-rename
 * 行名原地替换为单行 input（PH-13/14/15）。
 * 用法：
 *   DSInlineRename.begin({
 *     anchor: nameSpan,          // 被重命名的名称节点（重命名期间加 hidden）
 *     initial: '当前名',
 *     onCommit: function(title){ ... },  // 仅在 trim 非空且有变化时调用
 *     onStateChange: function(editing){ ... } // 编辑期间禁用行菜单/展收
 *   });
 * 规则：Enter 或失焦提交（空名还原旧名），Esc 取消；input 宽度由 flex 约束在行可用宽内。
 */
(function (global) {
  'use strict';

  function begin(opts) {
    var anchor = opts.anchor;
    if (!anchor || anchor.__dsRenaming) return;
    anchor.__dsRenaming = true;

    var initial = (opts.initial != null ? String(opts.initial) : anchor.textContent).trim();
    var row = anchor.closest('[data-rename-row]') || anchor.parentElement;
    var controls = row ? row.querySelectorAll('button:not(.ds-rename__input)') : [];

    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'ds-rename__input';
    input.value = initial;
    input.setAttribute('aria-label', '重命名');

    function setControlsDisabled(on) {
      Array.prototype.forEach.call(controls, function (b) {
        if (on) b.setAttribute('disabled', '');
        else b.removeAttribute('disabled');
      });
      if (typeof opts.onStateChange === 'function') opts.onStateChange(on);
    }

    function finish(commit) {
      if (!anchor.__dsRenaming) return;
      anchor.__dsRenaming = false;
      document.removeEventListener('pointerdown', onOutside, true);
      if (input.parentNode) input.parentNode.removeChild(input);
      anchor.hidden = false;
      setControlsDisabled(false);
      if (commit) {
        var v = input.value.trim();
        if (v && v !== initial && typeof opts.onCommit === 'function') opts.onCommit(v);
      }
    }

    function onKeydown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        e.stopPropagation();
        finish(true);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        finish(false);
      }
    }

    function onBlur() {
      // 让 Esc 的 finish 先执行；失焦一律走提交（空名会被还原）
      setTimeout(function () { finish(true); }, 0);
    }

    function onOutside(e) {
      if (e.target === input) return;
      // 失焦会自行收尾；捕获监听仅用于极端场景下的及时提交
    }

    anchor.hidden = true;
    anchor.parentNode.insertBefore(input, anchor.nextSibling);
    setControlsDisabled(true);
    input.focus();
    input.select();
    input.addEventListener('keydown', onKeydown);
    input.addEventListener('blur', onBlur);
    document.addEventListener('pointerdown', onOutside, true);
  }

  global.DSInlineRename = { begin: begin };
})(window);

/* ===== [复制区] 组件 JS 开始：history-tree ===== */
/* history-tree
 * 左栏项目/会话两级树（PH-1/3/4/5/6/7、PH-N1~N3、PH-8~18）。
 * 种子数据：根节点内 script[data-history-seed]；自动初始化 [data-component=history-tree]。
 * 事件（document 级 CustomEvent）：
 *   project:create {id} / conversation:create {inProject}
 *   conversation:open {id,inProject}
 *   project:rename|conversation:rename {id,title}
 *   project:pin|conversation:pin {id,pinned}
 *   conversation:delete {id} / project:delete {id,conversationIds}
 * API：DSHistoryTree.forRoot(root).createProject() / .createConversation(projectId|null)
 *      / .clearSelection()（取消当前会话高亮，不派发事件，用于「新建会话」等外部入口）
 */
(function (global) {
  'use strict';

  var GROUP_LABELS = { projects: '项目', recent: '最近' };

  function emit(name, detail) {
    document.dispatchEvent(new CustomEvent(name, { detail: detail || {} }));
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* 稳定排序：置顶在前，组内保持原有相对顺序（时间序） */
  function pinSorted(list) {
    return list.map(function (x, i) { return [x, i]; })
      .sort(function (a, b) {
        return (b[0].pinned ? 1 : 0) - (a[0].pinned ? 1 : 0) || a[1] - b[1];
      })
      .map(function (p) { return p[0]; });
  }

  function icon(name, size) {
    return '<svg class="ds-icon" viewBox="0 0 24 24" width="' + size + '" height="' + size + '" aria-hidden="true">' +
      '<use href="#i-' + name + '"></use></svg>';
  }

  function iconBtn(attrs, iconName, label) {
    return '<button type="button" class="ds-icon-btn ds-icon-btn--sm" ' + attrs + ' aria-label="' + label + '">' +
      icon(iconName, 16) + '</button>';
  }

  function HistoryTree(root) {
    this.root = root;
    var seedEl = root.querySelector('script[data-history-seed]');
    this.state = JSON.parse(seedEl.textContent || '{}');
    this.state.projects = this.state.projects || [];
    this.state.recent = this.state.recent || [];
    this.state.groupsExpanded = this.state.groupsExpanded || { projects: true, recent: true };
    this.seq = 100;
    this.pendingRename = null;
    this.focusSelector = null;
    this.bind();
    this.render();
  }

  HistoryTree.prototype.nextId = function (prefix) {
    this.seq += 1;
    return prefix + this.seq;
  };

  HistoryTree.prototype.bind = function () {
    var self = this;
    this.root.addEventListener('click', function (e) {
      var actEl = e.target.closest && e.target.closest('[data-act]');
      if (!actEl || !self.root.contains(actEl)) return;
      var act = actEl.getAttribute('data-act');
      var projectWrapper = actEl.closest('.ds-history__project');
      var projectId = projectWrapper ? projectWrapper.getAttribute('data-project-id') : null;
      var convRow = actEl.closest('[data-conv-id]');
      var convId = convRow ? convRow.getAttribute('data-conv-id') : null;
      var inProject = convRow ? convRow.getAttribute('data-in-project') : null;

      switch (act) {
        case 'toggle-group':
          self.toggleGroup(actEl.getAttribute('data-group'));
          break;
        case 'project-toggle':
          self.toggleProject(projectId);
          break;
        case 'project-create':
          self.createProject();
          break;
        case 'conversation-create':
          self.createConversation(actEl.getAttribute('data-in-project') || projectId);
          break;
        case 'open':
          /* 延迟打开，给双击重命名让路（否则首次 click 的重渲染会吃掉 dblclick） */
          self.scheduleOpen(convId, inProject ? inProject : null);
          break;
        case 'menu':
          self.openMenu(actEl, projectId, convId, inProject ? inProject : null);
          break;
      }
    });

    /* 双击名称进入重命名（PH-13）；取消挂起的单击打开 */
    this.root.addEventListener('dblclick', function (e) {
      if (self.openTimer) { clearTimeout(self.openTimer); self.openTimer = null; }
      var label = e.target.closest && e.target.closest('[data-label]');
      if (!label || !self.root.contains(label)) return;
      var projectWrapper = label.closest('.ds-history__project');
      var convRow = label.closest('[data-conv-id]');
      if (convRow) {
        self.startRename('conversation', convRow.getAttribute('data-conv-id'));
      } else if (projectWrapper) {
        self.startRename('project', projectWrapper.getAttribute('data-project-id'));
      }
    });
  };

  HistoryTree.prototype.toggleGroup = function (group) {
    this.state.groupsExpanded[group] = !this.state.groupsExpanded[group];
    this.render();
  };

  HistoryTree.prototype.toggleProject = function (projectId) {
    var p = this.findProject(projectId);
    if (p) p.expanded = !p.expanded;
    this.render();
  };

  HistoryTree.prototype.findProject = function (id) {
    for (var i = 0; i < this.state.projects.length; i++) {
      if (this.state.projects[i].id === id) return this.state.projects[i];
    }
    return null;
  };

  HistoryTree.prototype.findConversation = function (id) {
    var i, j, p;
    for (i = 0; i < this.state.projects.length; i++) {
      p = this.state.projects[i];
      for (j = 0; j < p.conversations.length; j++) {
        if (p.conversations[j].id === id) return { item: p.conversations[j], project: p };
      }
    }
    for (i = 0; i < this.state.recent.length; i++) {
      if (this.state.recent[i].id === id) return { item: this.state.recent[i], project: null };
    }
    return null;
  };

  HistoryTree.prototype.createProject = function () {
    var p = {
      id: this.nextId('p'),
      title: '新项目',
      pinned: false,
      expanded: true,
      conversations: [],
      renamed: false
    };
    this.state.projects.push(p);
    this.state.groupsExpanded.projects = true;
    this.pendingRename = { kind: 'project', id: p.id };
    emit('project:create', { id: p.id });
    this.render();
  };

  HistoryTree.prototype.createConversation = function (inProjectId) {
    var c = { id: this.nextId('c'), title: '新会话', pinned: false, renamed: false };
    var project = inProjectId ? this.findProject(inProjectId) : null;
    var list = project ? project.conversations : this.state.recent;
    var insertAt = 0;
    while (insertAt < list.length && list[insertAt].pinned) insertAt++;
    list.splice(insertAt, 0, c);
    if (project) {
      project.expanded = true;
      this.state.groupsExpanded.projects = true;
    } else {
      this.state.groupsExpanded.recent = true;
    }
    this.state.selectedId = c.id;
    var inProject = project ? project.id : null;
    emit('conversation:create', { id: c.id, inProject: inProject });
    emit('conversation:open', { id: c.id, inProject: inProject });
    this.focusSelector = '[data-conv-id="' + c.id + '"] .ds-history__main';
    this.render();
  };

  HistoryTree.prototype.scheduleOpen = function (id, inProject) {
    var self = this;
    if (this.openTimer) clearTimeout(this.openTimer);
    this.openTimer = setTimeout(function () {
      self.openTimer = null;
      self.openConversation(id, inProject);
    }, 220);
  };

  HistoryTree.prototype.openConversation = function (id, inProject) {
    this.state.selectedId = id;
    emit('conversation:open', { id: id, inProject: inProject || null });
    this.focusSelector = '[data-conv-id="' + id + '"] .ds-history__main';
    this.render();
  };

  /* 外部「新建会话」入口用：仅清掉当前行高亮，不增删数据、不派发事件 */
  HistoryTree.prototype.clearSelection = function () {
    if (this.state.selectedId == null) return;
    this.state.selectedId = null;
    this.render();
  };

  HistoryTree.prototype.startRename = function (kind, id) {
    this.pendingRename = { kind: kind, id: id };
    this.render();
  };

  HistoryTree.prototype.commitRename = function (kind, id, title) {
    var target;
    if (kind === 'project') {
      target = this.findProject(id);
      if (target) {
        target.title = title;
        target.renamed = true;
        emit('project:rename', { id: id, title: title });
      }
    } else {
      target = this.findConversation(id);
      if (target) {
        target.item.title = title;
        target.item.renamed = true;
        emit('conversation:rename', { id: id, title: title });
      }
    }
    this.pendingRename = null;
    this.render();
  };

  HistoryTree.prototype.togglePin = function (kind, id) {
    var item, pinned;
    if (kind === 'project') {
      item = this.findProject(id);
      if (item) {
        item.pinned = !item.pinned;
        emit('project:pin', { id: id, pinned: item.pinned });
      }
    } else {
      item = this.findConversation(id);
      if (item) {
        item.item.pinned = !item.item.pinned;
        emit('conversation:pin', { id: id, pinned: item.item.pinned });
      }
    }
    this.render();
  };

  HistoryTree.prototype.moveOutOfProject = function (id) {
    var found = this.findConversation(id);
    if (!found || !found.project) return;
    var list = found.project.conversations;
    list.splice(list.indexOf(found.item), 1);
    var insertAt = 0;
    while (insertAt < this.state.recent.length && this.state.recent[insertAt].pinned) insertAt++;
    this.state.recent.splice(insertAt, 0, found.item);
    this.state.groupsExpanded.recent = true;
    this.render();
  };

  HistoryTree.prototype.deleteConversation = function (id, trigger) {
    var self = this;
    var found = this.findConversation(id);
    if (!found) return;
    DSDialog.confirm({
      title: '删除该会话？',
      body: '__DELETE_CONVERSATION_CONFIRM_BODY__',
      confirmText: '删除',
      cancelText: '取消',
      danger: true,
      returnFocus: trigger || null
    }).then(function (ok) {
      if (!ok) return;
      if (found.project) {
        var list = found.project.conversations;
        list.splice(list.indexOf(found.item), 1);
      } else {
        self.state.recent.splice(self.state.recent.indexOf(found.item), 1);
      }
      if (self.state.selectedId === id) self.state.selectedId = null;
      emit('conversation:delete', { id: id });
      self.focusSelector = '[data-act="project-create"]';
      self.render();
    });
  };

  HistoryTree.prototype.deleteProject = function (id, trigger) {
    var self = this;
    var p = this.findProject(id);
    if (!p) return;
    var n = p.conversations.length;
    var body = n > 0
      ? '将同时删除该项目及其下 ' + n + ' 个会话，删除后不可恢复。'
      : '删除后不可恢复。';
    DSDialog.confirm({
      title: '__DELETE_PROJECT_CONFIRM_TITLE__',
      body: body,
      confirmText: n > 0 ? '删除项目及 ' + n + ' 个会话' : '删除项目',
      cancelText: '取消',
      danger: true,
      returnFocus: trigger || null
    }).then(function (ok) {
      if (!ok) return;
      var ids = p.conversations.map(function (c) { return c.id; });
      self.state.projects.splice(self.state.projects.indexOf(p), 1);
      if (ids.indexOf(self.state.selectedId) !== -1) self.state.selectedId = null;
      emit('project:delete', { id: id, conversationIds: ids });
      self.focusSelector = '[data-act="project-create"]';
      self.render();
    });
  };

  HistoryTree.prototype.openMenu = function (anchor, projectId, convId, inProject) {
    var self = this;
    var items;
    if (projectId && !convId) {
      var p = this.findProject(projectId);
      items = [
        { icon: 'message-plus', label: '在项目中新建会话', action: 'create-conv' },
        { icon: 'pencil', label: '重命名', action: 'rename' },
        { icon: 'pin', label: p && p.pinned ? '取消置顶' : '置顶', action: 'pin' },
        { divider: true },
        { icon: 'trash', label: '删除项目', action: 'delete', danger: true }
      ];
    } else {
      items = [
        { icon: 'pencil', label: '重命名', action: 'rename' }
      ];
      if (inProject) {
        items.push({ icon: 'folder-input', label: '移出项目', action: 'move-out' });
      }
      items.push({ icon: 'folder-input', label: '移动到项目…', action: 'move-to', disabled: true });
      var found = this.findConversation(convId);
      items.push({
        icon: 'pin',
        label: found && found.item.pinned ? '取消置顶' : '置顶',
        action: 'pin'
      });
      items.push({ divider: true });
      items.push({ icon: 'trash', label: '删除', action: 'delete', danger: true });
    }

    DSPopoverMenu.open({
      anchor: anchor,
      align: 'start',
      items: items,
      onSelect: function (action) {
        switch (action) {
          case 'create-conv':
            self.createConversation(projectId);
            break;
          case 'rename':
            if (convId) self.startRename('conversation', convId);
            else self.startRename('project', projectId);
            break;
          case 'pin':
            if (convId) self.togglePin('conversation', convId);
            else self.togglePin('project', projectId);
            break;
          case 'move-out':
            self.moveOutOfProject(convId);
            break;
          case 'delete':
            if (convId) self.deleteConversation(convId, anchor);
            else self.deleteProject(projectId, anchor);
            break;
        }
      }
    });
  };

  HistoryTree.prototype.renderGroupHead = function (group) {
    var expanded = !!this.state.groupsExpanded[group];
    var create = group === 'projects'
      ? iconBtn('data-act="project-create"', 'folder-plus', '新建项目')
      : iconBtn('data-act="conversation-create" data-in-project=""', 'message-plus', '新建会话');
    return '<div class="ds-history__group-head">' +
      iconBtn('data-act="toggle-group" data-group="' + group + '" aria-expanded="' + expanded + '"',
        'chevron-down', expanded ? '折叠' + GROUP_LABELS[group] + '分组' : '展开' + GROUP_LABELS[group] + '分组') +
      '<span class="ds-history__group-label">' + GROUP_LABELS[group] + '</span>' +
      '<span class="ds-history__group-actions">' + create + '</span>' +
      '</div>';
  };

  HistoryTree.prototype.renderRowActions = function (convId) {
    var inner;
    if (convId) {
      inner = iconBtn('data-act="menu" aria-haspopup="menu" aria-expanded="false"',
        'more-horizontal', '更多操作');
    } else {
      inner = iconBtn('data-act="conversation-create"', 'message-plus', '在项目中新建会话') +
        iconBtn('data-act="menu" aria-haspopup="menu" aria-expanded="false"',
          'more-horizontal', '更多操作');
    }
    return '<span class="ds-history__row-actions">' + inner + '</span>';
  };

  HistoryTree.prototype.renderProject = function (p) {
    var self = this;
    var isParent = p.conversations.some(function (c) { return c.id === self.state.selectedId; });
    var rows = pinSorted(p.conversations).map(function (c) {
      return self.renderConversationRow(c, p.id, false);
    }).join('');
    var rowCls = 'ds-history__row ds-history__row--project' + (isParent ? ' is-parent' : '');
    return '<div class="ds-history__project" data-project-id="' + esc(p.id) + '" data-expanded="' + !!p.expanded + '">' +
      '<div class="' + rowCls + '" data-rename-row>' +
      iconBtn('data-act="project-toggle" aria-expanded="' + !!p.expanded + '"',
        'chevron-down', p.expanded ? '折叠项目' : '展开项目') +
      icon(p.expanded ? 'folder-open' : 'folder', 16).replace('class="ds-icon"', 'class="ds-icon ds-history__folder"') +
      '<span class="ds-history__label ds-rename__anchor" data-label>' + esc(p.title) + '</span>' +
      this.renderRowActions(null) +
      '</div>' +
      '<div class="ds-history__project-body">' + rows + '</div>' +
      '</div>';
  };

  HistoryTree.prototype.renderConversationRow = function (c, projectId, isRecent) {
    var cls = 'ds-history__row ds-history__row--conversation' +
      (isRecent ? ' ds-history__row--recent' : '') +
      (this.state.selectedId === c.id ? ' is-current' : '');
    var inProjectAttr = projectId ? ' data-in-project="' + esc(projectId) + '"' : ' data-in-project=""';
    return '<div class="' + cls + '" data-rename-row data-conv-id="' + esc(c.id) + '"' + inProjectAttr + '>' +
      '<button type="button" class="ds-history__main" data-act="open" data-label aria-label="' + esc(c.title) + '">' +
      esc(c.title) + '</button>' +
      this.renderRowActions(c.id) +
      '</div>';
  };

  HistoryTree.prototype.render = function () {
    var projectsHtml = pinSorted(this.state.projects)
      .map(this.renderProject.bind(this)).join('');
    var recentHtml = pinSorted(this.state.recent)
      .map(function (c) { return this.renderConversationRow(c, null, true); }.bind(this)).join('');

    this.root.innerHTML =
      '<div class="ds-history__group" data-group="projects" data-expanded="' + !!this.state.groupsExpanded.projects + '">' +
        this.renderGroupHead('projects') +
        '<div class="ds-history__group-body">' + projectsHtml + '</div>' +
      '</div>' +
      '<div class="ds-history__group" data-group="recent" data-expanded="' + !!this.state.groupsExpanded.recent + '">' +
        this.renderGroupHead('recent') +
        '<div class="ds-history__group-body">' + recentHtml + '</div>' +
      '</div>';

    if (this.pendingRename) this.applyPendingRename();

    if (this.focusSelector) {
      var el = this.root.querySelector(this.focusSelector);
      this.focusSelector = null;
      if (el) el.focus();
    }
  };

  HistoryTree.prototype.applyPendingRename = function () {
    var self = this;
    var pr = this.pendingRename;
    var selector;
    var found;
    if (pr.kind === 'project') {
      selector = '.ds-history__project[data-project-id="' + pr.id.replace(/"/g, '') + '"] [data-label]';
      found = this.findProject(pr.id);
    } else {
      selector = '[data-conv-id="' + pr.id.replace(/"/g, '') + '"] [data-label]';
      found = this.findConversation(pr.id);
    }
    var anchor = this.root.querySelector(selector);
    if (!anchor || !found) {
      this.pendingRename = null;
      return;
    }
    var title = pr.kind === 'project' ? found.title : found.item.title;
    DSInlineRename.begin({
      anchor: anchor,
      initial: title,
      onStateChange: function (editing) {
        var row = anchor.closest('[data-rename-row]');
        if (row) row.classList.toggle('is-renaming', editing);
      },
      onCommit: function (v) {
        self.commitRename(pr.kind, pr.id, v);
      }
    });
  };

  function forRoot(root) {
    if (!root) return null;
    if (!root.__dsHistoryApi) {
      var tree = new HistoryTree(root);
      root.__dsHistory = tree;
      root.__dsHistoryApi = {
        createProject: tree.createProject.bind(tree),
        createConversation: tree.createConversation.bind(tree),
        clearSelection: tree.clearSelection.bind(tree),
        get state() { return tree.state; }
      };
    }
    return root.__dsHistoryApi;
  }

  function autoInit() {
    Array.prototype.forEach.call(
      document.querySelectorAll('[data-component="history-tree"]'),
      forRoot
    );
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', autoInit);
  } else {
    autoInit();
  }

  global.DSHistoryTree = { forRoot: forRoot };
})(window);
/* ===== [复制区] 组件 JS 结束：history-tree ===== */
</script>
<script>
/* —— 演示外壳脚本（禁止复制进交付物）—— */
document.getElementById('demo-theme').addEventListener('click', () => {
  const el = document.documentElement;
  el.dataset.theme = el.dataset.theme === 'dark' ? 'light' : 'dark';
});

/* —— history-tree 演示接线（禁止复制进交付物）—— */
(function () {
  var root = document.getElementById('ht-demo');
  var logEl = document.getElementById('ht-event-log');
  if (!root) return;
  var api = DSHistoryTree.forRoot(root);
  var lines = [];

  var NAMES = [
    'project:create', 'conversation:create', 'conversation:open',
    'project:rename', 'conversation:rename',
    'project:pin', 'conversation:pin',
    'project:delete', 'conversation:delete'
  ];
  NAMES.forEach(function (name) {
    document.addEventListener(name, function (e) {
      lines.push(name + ' ' + JSON.stringify(e.detail));
      if (lines.length > 12) lines.shift();
      if (logEl) logEl.textContent = lines.join('\n');
    });
  });

  var btnConv = document.getElementById('ht-new-conv-top');
  var btnProject = document.getElementById('ht-new-project-top');
  if (btnConv) btnConv.addEventListener('click', function () { api.createConversation(null); });
  if (btnProject) btnProject.addEventListener('click', function () { api.createProject(); });
})();

</script>
