:root {

  /* 图表系列 */
  --ds-chart-1: #2563EB;

  --ds-space-4: 16px;
  --ds-space-5: 20px;

  --ds-fs-display: 32px;

  --ds-weight-regular: 400;

/* 盒模型统一 border-box：几何 token 表达含边框的完整盒 */
*,
*::before,
*::after {
  box-sizing: border-box;
}

/* 页面基色单点定义：只有 body 可以设置页面背景；组件内部不再设置基色 */
body {
  margin: 0;
  padding: 0;
  background: var(--ds-surface);
  color: var(--ds-text-primary);
  font-family: var(--ds-font-sans);
  font-size: var(--ds-fs-body);
  line-height: var(--ds-lh-body);
  font-weight: var(--ds-weight-regular);
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* 本地字体重置：控件继承 sans，数字使用 tabular-nums */
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

svg text {
  font-family: var(--ds-font-sans);
}

.ds-number,
[class*="number"] {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* 图标统一渲染：1.8px 线性、currentColor、round；外层 svg 必须带 viewBox="0 0 24 24"，
   尺寸由其 width/height 属性控制（16/18/20/24），否则 <use> 内 symbol 会按 24px 原尺寸溢出被裁 */
.ds-icon {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}

/* 原生控件保持中性，不用浏览器默认蓝 */
input[type="range"],
input[type="checkbox"],
input[type="radio"],
progress {
  accent-color: var(--ds-text-primary);
}

/* 统一焦点环：深色，不用蓝；box-shadow 自动跟随元素自身圆角，不在此覆盖圆角 */
:focus-visible {
  outline: none;
  box-shadow: var(--ds-focus-ring);
}

/* 尊重减弱动效偏好 */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ===== [复制区] 依赖组件 CSS：button（随本组件一并复制） ===== */
/* button —— 基础按钮：颜色强调只用深色，灰阶承担交互态 */
[data-component="button"] {
  /* 组件自身无包裹样式；.ds-btn 为复制后使用的根类 */
}

.ds-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--ds-space-2);
  box-sizing: border-box;
  height: 32px;
  padding: 0 var(--ds-space-4);
  margin: 0;
  border: 1px solid var(--ds-border);
  border-radius: var(--ds-radius-button);
  background-color: var(--ds-surface-raised);
  color: var(--ds-text-primary);
  font-family: inherit;
  font-size: var(--ds-fs-compact);
  font-weight: var(--ds-weight-medium);
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  transition:
    background-color var(--ds-t-fast) var(--ds-ease-standard),
    border-color var(--ds-t-fast) var(--ds-ease-standard);
}

.ds-btn:hover {
  background-color: var(--ds-surface-strong);
  border-color: var(--ds-border-strong);
}

.ds-btn:active {
  background-color: var(--ds-surface-strong);
}

.ds-btn .ds-icon {
  flex: none;
}

/* primary：深色实底；hover/active 用主题感知的中性叠加层（浅=压黑，深=提白） */
.ds-btn--primary {
  background-color: var(--ds-text-primary);
  border-color: var(--ds-text-primary);
  color: var(--ds-on-primary);
}

.ds-btn--primary:hover {
  background-color: var(--ds-text-primary);
  border-color: var(--ds-text-primary);
  background-image: linear-gradient(var(--ds-hover-fill), var(--ds-hover-fill));
}

.ds-btn--primary:active {
  background-image: linear-gradient(var(--ds-active-fill), var(--ds-active-fill));
}

/* ghost：无底无框，仅 hover 显露灰底 */
.ds-btn--ghost {
  background-color: transparent;
  border-color: transparent;
}

.ds-btn--ghost:hover {
  background-color: var(--ds-hover-fill);
  border-color: transparent;
}

.ds-btn--ghost:active {
  background-color: var(--ds-active-fill);
}

/* danger：危险实底，仅用于删除等破坏性主动作 */
.ds-btn--danger {
  background-color: var(--ds-color-danger);
  border-color: var(--ds-color-danger);
  color: var(--ds-on-danger);
}

.ds-btn--danger:hover {
  background-color: var(--ds-color-danger);
  border-color: var(--ds-color-danger);
  background-image: linear-gradient(var(--ds-hover-fill), var(--ds-hover-fill));
}

.ds-btn--danger:active {
  background-image: linear-gradient(var(--ds-active-fill), var(--ds-active-fill));
}

/* 尺寸 */
.ds-btn--sm {
  height: 28px;
  padding: 0 var(--ds-space-3);
  font-size: var(--ds-fs-caption);
  border-radius: var(--ds-radius-chip);
}

/* 禁用：disabled 属性驱动，键盘不可达、不派发 click */
.ds-btn:disabled,
.ds-btn[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.5;
  background-image: none;
}

.ds-btn--primary:disabled,
.ds-btn--danger:disabled {
  background-color: var(--ds-text-quaternary);
  border-color: var(--ds-text-quaternary);
  color: var(--ds-on-primary);
}

.ds-btn--ghost:disabled {
  background-color: transparent;
}

.ds-btn--block {
  display: flex;
  width: 100%;
}

/* ===== [复制区] 依赖组件 CSS：icon-button（随本组件一并复制） ===== */
/* icon-button —— 视觉盒 24/32，命中区恒 44px（::before 向四周外扩，不占布局） */
.ds-icon-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  width: 32px;
  height: 32px;
  padding: 0;
  margin: 0;
  border: none;
  border-radius: var(--ds-radius-button);
  background-color: transparent;
  color: var(--ds-text-secondary);
  cursor: pointer;
  flex: none;
  transition:
    background-color var(--ds-t-fast) var(--ds-ease-standard),
    color var(--ds-t-fast) var(--ds-ease-standard);
}

/* hidden 属性必须生效：本基元 display:inline-flex（作者样式）会压过 UA 的 [hidden]{display:none}，
   不显式补回会导致"隐藏"按钮仍渲染（如壳层右栏互斥展收钮） */
.ds-icon-btn[hidden] {
  display: none;
}

/* 命中区外扩到触控下限：absolute 居中、不改变布局与视觉盒 */
.ds-icon-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  min-width: var(--ds-touch-target);
  min-height: var(--ds-touch-target);
  margin: auto;
}

.ds-icon-btn:hover {
  background-color: var(--ds-hover-fill);
  color: var(--ds-text-primary);
}

.ds-icon-btn:active {
  background-color: var(--ds-active-fill);
}

/* 选中/开关态：灰阶，不用彩色 */
.ds-icon-btn.is-active,
.ds-icon-btn[aria-pressed="true"] {
  background-color: var(--ds-active-fill);
  color: var(--ds-text-primary);
}

/* 置于填充区域内时的描边浅底变体 */
.ds-icon-btn--subtle {
  background-color: var(--ds-surface-muted);
}

.ds-icon-btn--subtle:hover {
  background-color: var(--ds-surface-strong);
}

/* 小尺寸视觉盒（命中区仍 44）；圆角与 md 同档：规则映射 icon buttons 统一 8px */
.ds-icon-btn--sm {
  width: 24px;
  height: 24px;
  border-radius: var(--ds-radius-button);
}

.ds-icon-btn:disabled,
.ds-icon-btn[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.4;
  background-color: transparent;
  color: var(--ds-text-quaternary);
}

.ds-icon-btn .ds-icon {
  flex: none;
}

/* ===== [复制区] 组件 CSS 开始：workbench-shell ===== */
/* workbench-shell —— 三栏几何；宽度由根上的 --shell-*-w 驱动，JS 只改这一个值 */
.ds-shell {
  --shell-left-w: var(--ds-left-width);
  --shell-right-w: var(--ds-right-width);

  display: flex;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--ds-surface);
  color: var(--ds-text-primary);
}

/* ---------- 左栏 ---------- */
.ds-shell__left {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  width: var(--shell-left-w);
  overflow: hidden;
  background: var(--ds-surface);
  border-right: 1px solid var(--ds-divider);
  transition: width var(--ds-t-slow) var(--ds-ease-out);
}

/* 收起态：宽度归 0，不保留 rail 容器；唯一展开入口是中栏 header 的展收钮（WS-15） */
.ds-shell[data-left="closed"] .ds-shell__left {
  width: 0;
  border-right-color: transparent;
}

.ds-shell__left-body {
  flex: 1 1 auto;
  overflow-x: hidden;
  overflow-y: auto;
  min-height: 0;
}

.ds-shell[data-left="closed"] .ds-shell__left-body {
  display: none;
}

/* ---------- 中栏 ---------- */
.ds-shell__center {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--ds-surface);
}

.ds-shell__center-header,
.ds-shell__right-header {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--ds-space-2);
  height: calc(var(--ds-touch-target) + var(--ds-space-1));
  padding: 0 var(--ds-space-2);
  background: var(--ds-surface);
  border-bottom: 1px solid var(--ds-divider);
}

.ds-shell__header-slot {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
}

.ds-shell__scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
}

.ds-shell__composer {
  flex: 0 0 auto;
  min-width: 0; /* CP-24：父链解除隐式最小宽度，保证 composer 随中栏收缩，内部控件不溢出 */
  /* 不画顶部分隔线：WS 合同未约定（1px divider 仅 header 下沿 WS-3 与手柄 WS-8）；
     与消息区的分隔由 P9 composer 实物自行决定，welcome 居中态有线会突兀 */
  background: var(--ds-surface);
}

.ds-shell__right-open {
  flex: none;
}

/* ---------- 拖拽手柄（8px 命中条骑在右栏 1px 分界线上） ---------- */
.ds-shell__resize {
  flex: 0 0 auto;
  align-self: stretch;
  width: 8px;
  margin-left: -4px;
  margin-right: -4px;
  z-index: 2;
  cursor: col-resize;
  touch-action: none;
  background-color: transparent;
}

.ds-shell__resize:hover,
.ds-shell__resize:focus-visible {
  background-color: var(--ds-hover-fill);
}

/* ---------- 右栏 ---------- */
.ds-shell__right {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  width: var(--shell-right-w);
  overflow: hidden;
  background: var(--ds-surface);
  border-left: 1px solid var(--ds-divider);
  transition: width var(--ds-t-slow) var(--ds-ease-out);
}

.ds-shell[data-right="closed"] .ds-shell__right {
  width: 0;
  border-left-color: transparent;
}

.ds-shell[data-right="closed"] .ds-shell__resize {
  display: none;
}

.ds-shell__right-title {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--ds-fs-compact);
  font-weight: var(--ds-weight-medium);
  color: var(--ds-text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ds-shell__right-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
}

/* ---------- 状态：首帧不做恢复动画；拖拽中关过渡 ---------- */
.ds-shell:not([data-ready="1"]) .ds-shell__left,
.ds-shell:not([data-ready="1"]) .ds-shell__right {
  transition: none;
}

.ds-shell--dragging .ds-shell__left,
.ds-shell--dragging .ds-shell__right {
  transition: none;
}

/* 拖拽期间：全局禁选文本；右栏内容不吞指针事件，杜绝 reflow 闪烁（WS-10/11） */
body.ds-is-resizing {
  user-select: none;
  cursor: col-resize;
}

body.ds-is-resizing .ds-shell__right-scroll {
  pointer-events: none;
}

body.ds-is-resizing .ds-shell__resize {
  background-color: var(--ds-hover-fill);
}
/* ===== [复制区] 组件 CSS 结束：workbench-shell ===== */

/* —— 演示外壳（仅供组件实物页，禁止复制进交付物）—— */
.demo-topbar { position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:12px;
  height:48px; padding:0 16px; background:var(--ds-surface); border-bottom:1px solid var(--ds-divider); }
.demo-topbar__title { font-size:var(--ds-fs-compact); font-weight:var(--ds-weight-medium); }
.demo-topbar__tag { font-size:var(--ds-fs-caption); color:var(--ds-text-tertiary); }
.demo-topbar__spacer { flex:1; }
.demo-main { padding:24px; }
.demo-section { margin-bottom:24px; }
.demo-section > h3 { font-size:var(--ds-fs-caption); font-weight:var(--ds-weight-medium);
  color:var(--ds-text-tertiary); margin:0 0 8px; text-transform:uppercase; letter-spacing:.04em; }
.demo-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.demo-row + .demo-row { margin-top:12px; }
.demo-canvas { border:1px dashed var(--ds-border-strong); border-radius:var(--ds-radius-panel); padding:16px; }

/* shell 演示页：占满视口、body 不滚（验证 WS-1），topbar 之外全给壳层 */
html, body { height: 100%; }
body { overflow: hidden; }
.demo-main { height: calc(100vh - 48px); padding: 0; }

/* 区域填充：模拟后续 P7–P10 组件内容，验证滚动归属与几何 */

 *   sidebar:toggle     {collapsed:boolean}     折叠/展开左栏

 *   rightpanel:resize  {width:number}           拖拽/键盘调宽提交后由壳派发（bubbles）
 * localStorage 键见 spec.localStorage；非法值回退 token 默认。
 */
(function () {
  'use strict';

  var KEY = {
    leftCollapsed: 'ds.chat-workbench.sidebar.collapsed',
    rightOpen: 'ds.chat-workbench.rightPanel.open',
    rightWidth: 'ds.chat-workbench.rightPanel.width'
  };
  var STEP = 16; // 键盘调宽步进 = --ds-space-4

  function tokenPx(root, name, fallback) {
    var v = parseFloat(getComputedStyle(root).getPropertyValue(name));
    return Number.isFinite(v) ? v : fallback;
  }

  function readBool(key, def) {
    try {
      var v = localStorage.getItem(key);
      if (v === null) return def;
      return v === '1';
    } catch (e) { return def; }
  }

  function writeBool(key, val) {
    try { localStorage.setItem(key, val ? '1' : '0'); } catch (e) { /* 隐私模式降级为内存态 */ }
  }

  function readNum(key, def) {
    try {
      var v = parseFloat(localStorage.getItem(key));
      return Number.isFinite(v) ? v : def;
    } catch (e) { return def; }
  }

  function writeNum(key, val) {
    try { localStorage.setItem(key, String(Math.round(val))); } catch (e) { /* ignore */ }
  }

  function clamp(v, min, max) {
    return Math.min(max, Math.max(min, v));
  }

  function init(root) {
    if (root.__dsShellInit) return;
    root.__dsShellInit = true;

    var leftEl = root.querySelector('.ds-shell__left');
    var rightEl = root.querySelector('.ds-shell__right');
    var handle = root.querySelector('.ds-shell__resize');
    var btnLeftToggle = root.querySelector('[data-action="left-toggle"]');
    var btnRightOpen = root.querySelector('[data-action="right-open"]');
    var btnRightClose = root.querySelector('[data-action="right-close"]');

    var limits = {
      rightMin: tokenPx(root, '--ds-right-min', 320),
      rightMax: tokenPx(root, '--ds-right-max', 720),
      centerMin: tokenPx(root, '--ds-center-min', 360)
    };

    // 初始优先级：localStorage 记忆 > data-left/data-right 声明默认 > 全打开
    var attrLeftClosed = root.getAttribute('data-left') === 'closed';
    var attrRightOpen = root.getAttribute('data-right') !== 'closed';
    var state = {
      leftCollapsed: readBool(KEY.leftCollapsed, attrLeftClosed),
      rightOpen: readBool(KEY.rightOpen, attrRightOpen),
      rightWidth: readNum(KEY.rightWidth, tokenPx(root, '--ds-right-width', 480))
    };

    function currentLeftWidth() {
      return leftEl.getBoundingClientRect().width;
    }

    /* 视口约束：中栏不得小于 centerMin；返回当前合法右宽上限 */
    function maxWidthForViewport() {
      return window.innerWidth - currentLeftWidth() - limits.centerMin;
    }

    function clampRight(w) {
      return clamp(w, limits.rightMin, Math.max(limits.rightMin, maxWidthForViewport()));
    }

    function emit(name, detail) {
      root.dispatchEvent(new CustomEvent(name, { bubbles: true, detail: detail || {} }));
    }

    function sync() {
      root.dataset.left = state.leftCollapsed ? 'closed' : 'open';
      root.dataset.right = state.rightOpen ? 'open' : 'closed';

      var w = clampRight(state.rightWidth);
      root.style.setProperty('--shell-right-w', w + 'px');
      handle.setAttribute('aria-valuenow', String(Math.round(w)));

      btnLeftToggle.setAttribute('aria-expanded', String(!state.leftCollapsed));
      btnLeftToggle.setAttribute('aria-label', state.leftCollapsed ? '展开左栏' : '折叠左栏');
      // 右栏展收入口互斥：展开只留右栏 header 的关闭钮；收起只留中栏 header 的打开钮
      btnRightOpen.hidden = state.rightOpen;
      btnRightOpen.setAttribute('aria-expanded', String(state.rightOpen));
      btnRightClose.setAttribute('aria-expanded', String(state.rightOpen));
    }

    function setLeft(collapsed) {
      var next = !!collapsed;
      if (next === state.leftCollapsed && root.dataset.ready === '1') return;
      state.leftCollapsed = next;
      writeBool(KEY.leftCollapsed, next);
      sync();
    }

    function setRight(open) {
      var next = typeof open === 'boolean' ? open : !state.rightOpen;
      state.rightOpen = next;
      writeBool(KEY.rightOpen, next);
      sync();
    }

    function setWidth(w, persist) {
      state.rightWidth = clampRight(w);
      root.style.setProperty('--shell-right-w', state.rightWidth + 'px');
      handle.setAttribute('aria-valuenow', String(Math.round(state.rightWidth)));
      if (persist) {
        writeNum(KEY.rightWidth, state.rightWidth);
        emit('rightpanel:resize', { width: Math.round(state.rightWidth) });
      }
    }

    /* ---- 内部按钮：统一走 document 事件，外部组件也能驱动 ---- */
    btnLeftToggle.addEventListener('click', function () {
      document.dispatchEvent(new CustomEvent('sidebar:toggle', { detail: { collapsed: !state.leftCollapsed } }));
    });
    btnRightOpen.addEventListener('click', function () {
      document.dispatchEvent(new CustomEvent('rightpanel:toggle', { detail: { open: true } }));
    });
    btnRightClose.addEventListener('click', function () {
      document.dispatchEvent(new CustomEvent('rightpanel:toggle', { detail: { open: false } }));
    });

    document.addEventListener('sidebar:toggle', function (e) {
      setLeft(typeof e.detail.collapsed === 'boolean' ? e.detail.collapsed : !state.leftCollapsed);
    });
    document.addEventListener('rightpanel:toggle', function (e) {
      setRight(e.detail && typeof e.detail.open === 'boolean' ? e.detail.open : undefined);
    });
    document.addEventListener('artifact:open', function () {
      if (!state.rightOpen) setRight(true); // WS-14
    });

    /* ---- 拖拽调宽（Pointer Events） ---- */
    var dragging = false;

    function dragWidthFromX(clientX) {
      return window.innerWidth - clientX;
    }

    /* move/up 挂在 window 而非手柄：不完全依赖 pointer capture 的事件重定向，
       指针快速滑出或落在邻栏时拖拽也不中断（WS-9/11） */
    function onDragMove(e) {
      // 不提交（不 persist、不派发），只改一个 CSS 像素值
      state.rightWidth = clampRight(dragWidthFromX(e.clientX));
      root.style.setProperty('--shell-right-w', state.rightWidth + 'px');
      handle.setAttribute('aria-valuenow', String(Math.round(state.rightWidth)));
    }

    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      root.classList.remove('ds-shell--dragging');
      document.body.classList.remove('ds-is-resizing');
      window.removeEventListener('pointermove', onDragMove);
      window.removeEventListener('pointerup', endDrag);
      window.removeEventListener('pointercancel', endDrag);
      try {
        if (e && e.pointerId != null && handle.hasPointerCapture && handle.hasPointerCapture(e.pointerId)) {
          handle.releasePointerCapture(e.pointerId);
        }
      } catch (err) {}
      writeNum(KEY.rightWidth, state.rightWidth);
      emit('rightpanel:resize', { width: Math.round(state.rightWidth) });
    }

    handle.addEventListener('pointerdown', function (e) {
      if (!state.rightOpen) return;
      dragging = true;
      e.preventDefault();
      try { handle.setPointerCapture(e.pointerId); } catch (err) {}
      root.classList.add('ds-shell--dragging');
      document.body.classList.add('ds-is-resizing');
      window.addEventListener('pointermove', onDragMove);
      window.addEventListener('pointerup', endDrag);
      window.addEventListener('pointercancel', endDrag);
    });

    /* ---- 键盘：←加宽 →减宽（右栏锚定视口右缘），Home/End 极值 ---- */
    handle.addEventListener('keydown', function (e) {
      if (!state.rightOpen) return;
      var w = state.rightWidth;
      switch (e.key) {
        case 'ArrowLeft': e.preventDefault(); setWidth(w + STEP, true); break;
        case 'ArrowRight': e.preventDefault(); setWidth(w - STEP, true); break;
        case 'Home': e.preventDefault(); setWidth(limits.rightMin, true); break;
        case 'End': e.preventDefault(); setWidth(maxWidthForViewport(), true); break;
      }
    });

    /* ---- 视口缩小时重新钳制（不写盘，避免抖动污染记忆） ---- */
    window.addEventListener('resize', function () {
      var w = clampRight(state.rightWidth);
      state.rightWidth = w;
      root.style.setProperty('--shell-right-w', w + 'px');
      handle.setAttribute('aria-valuenow', String(Math.round(w)));
    });

    /* ---- 首帧直接终态，不开恢复动画（WS-13） ---- */
    sync();
    requestAnimationFrame(function () { root.dataset.ready = '1'; });

    root.__dsShellApi = {
      setLeft: setLeft,
      setRight: setRight,
      setWidth: function (w) { setWidth(w, true); },
      state: state
    };
  }

  function autoInit() {
    Array.prototype.forEach.call(
      document.querySelectorAll('[data-component="workbench-shell"]'),
      init
    );
  }

  // 脚本位于 body 末尾，DOM 已就绪
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', autoInit);
  } else {
    autoInit();
  }

  window.DSWorkbenchShell = {
    init: init,
    forRoot: function (root) { return root && root.__dsShellApi; }
  };
})();
/* ===== [复制区] 组件 JS 结束：workbench-shell ===== */
</script>

    Array.from({ length: 30 }, function (_, i) {

  composerSlot.innerHTML = '<div class="m2-composer-demo">composer 挂载位（P9）— 输入区钉底，不随对话流滚动</div>';

  var readout = document.getElementById('w-readout');
  function updateReadout() {
    var w = Math.round(shell.querySelector('.ds-shell__right').getBoundingClientRect().width);
    if (readout) readout.textContent = shell.dataset.right === 'open' ? String(w) : '已关闭';
  }
  shell.addEventListener('rightpanel:resize', updateReadout);
  document.addEventListener('rightpanel:toggle', function () { requestAnimationFrame(updateReadout); });
