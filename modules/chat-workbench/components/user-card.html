/* 盒模型统一 border-box：几何 token 表达含边框的完整盒 */
*,

*::after {

/* 页面基色单点定义：只有 body 可以设置页面背景；组件内部不再设置基色 */
body {
  margin: 0;
  padding: 0;
  background: var(--ds-surface);
  color: var(--ds-text-primary);
  font-family: var(--ds-font-sans);
  font-size: var(--ds-fs-body);
  line-height: var(--ds-lh-body);
  font-weight: var(--ds-weight-regular);
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* 本地字体重置：控件继承 sans，数字使用 tabular-nums */
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

svg text {
  font-family: var(--ds-font-sans);
}

.ds-number,
[class*="number"] {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* 图标统一渲染：1.8px 线性、currentColor、round；外层 svg 必须带 viewBox="0 0 24 24"，
   尺寸由其 width/height 属性控制（16/18/20/24），否则 <use> 内 symbol 会按 24px 原尺寸溢出被裁 */
.ds-icon {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}

/* 原生控件保持中性，不用浏览器默认蓝 */
input[type="range"],
input[type="checkbox"],
input[type="radio"],
progress {
  accent-color: var(--ds-text-primary);
}

/* 统一焦点环：深色，不用蓝；box-shadow 自动跟随元素自身圆角，不在此覆盖圆角 */
:focus-visible {
  outline: none;
  box-shadow: var(--ds-focus-ring);
}

/* 尊重减弱动效偏好 */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* user-card —— 左栏底部：圆形首字头像 + 用户名；顶 1px 分隔 */
.ds-usercard {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--ds-space-2);
  padding: var(--ds-space-2) var(--ds-space-3);
  border-top: 1px solid var(--ds-divider);
  font-size: var(--ds-fs-compact);
  color: var(--ds-text-primary);
}

.ds-usercard__avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: var(--ds-radius-full);
  background: var(--ds-text-primary);
  color: var(--ds-on-primary);
  font-size: var(--ds-fs-caption);
}

.ds-usercard__name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.demo-row + .demo-row { margin-top:12px; }
